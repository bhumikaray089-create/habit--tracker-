<!DOCTYPE html>
<html>
<head>
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Habit Tracker</h1>
    <input type="text" id="habitInput" placeholder="Enter a habit">
<button id="addHabit">Add Habit</button>

<ul id="habitList"></ul>

<h2>Daily checkpoints</h2>

<div class="checkpoints">
    <label><input type="checkbox" id="morning"> Morning</label>
    <label><input type="checkbox" id="afternoon"> Afternoon</label>
    <label><input type="checkbox" id="evening"> Evening</label>
    <label><input type="checkbox" id="night"> Night</label>
</div>
<p id="progressText">0% Complete</p>

<div class="progress-container">
    <div id="progressBar"></div>
</div>

<script src="script.js"></script> 

</body>
</html>
